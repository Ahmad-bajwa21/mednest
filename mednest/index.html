<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MedNest</title>
  <meta name="description" content="Your family's health, in one place — on your device." />
  <meta name="theme-color" content="#0F766E" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230F766E'/><path d='M50 26v48M26 50h48' stroke='white' stroke-width='10' stroke-linecap='round'/></svg>" />
  <style>
    /* ===== MedNest design tokens (spec §2.2–§2.5) — flat, no gradients, no shadows ===== */
    :root{
      --bg:#FFFFFF; --surface:#F6F7F8; --border:#E3E6E8;
      --text:#111417; --textMuted:#5E6870;
      --accent:#0F766E; --onAccent:#FFFFFF;
      --warn:#B45309; --danger:#B42318; --ok:#15803D;
      --r-card:12px; --r-chip:8px; --pad:16px; --maxw:520px;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#0E1113; --surface:#171B1E; --border:#2A3035;
        --text:#F2F4F5; --textMuted:#9AA5AD;
        --accent:#2DB5A8; --onAccent:#06211E;
        --warn:#F0A04B; --danger:#F2776B; --ok:#4CC38A;
      }
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;height:100%}
    body{
      background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
      font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
    }
    #app{max-width:var(--maxw);margin:0 auto;min-height:100%;display:flex;flex-direction:column}
    .screen{flex:1;padding:12px var(--pad) 96px;animation:fade .18s ease}
    @keyframes fade{from{opacity:0}to{opacity:1}}

    /* top bar */
    .topbar{display:flex;align-items:center;gap:12px;padding:10px var(--pad);min-height:56px;position:sticky;top:0;background:var(--bg);z-index:5}
    .topbar h1{font-size:20px;font-weight:600;margin:0;flex:1;letter-spacing:-.01em}
    .topbar .dot{width:12px;height:12px;border-radius:50%;flex:none}
    .iconbtn{background:none;border:none;color:var(--text);font-size:22px;width:44px;height:44px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .iconbtn:active{background:var(--surface)}
    .back{font-size:24px}

    /* type */
    .title{font-size:24px;font-weight:600;letter-spacing:-.01em;margin:8px 0}
    .muted{color:var(--textMuted)}
    .caption{font-size:12px;color:var(--textMuted)}
    .label{font-size:14px;font-weight:500;color:var(--textMuted);display:block;margin:14px 0 6px}
    h2.sec{font-size:13px;font-weight:600;color:var(--textMuted);letter-spacing:.04em;text-transform:uppercase;margin:22px 0 8px}

    /* card */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:var(--pad);margin:12px 0}
    .card.link{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .card.link:active{border-color:var(--accent)}
    .card .arrow{color:var(--textMuted);font-size:20px}
    .row{display:flex;align-items:center;gap:12px}
    .grow{flex:1;min-width:0}
    .name{font-weight:600}
    .truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* buttons */
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:var(--r-card);font-size:16px;font-weight:600;border:1px solid transparent;cursor:pointer;margin-top:12px}
    .btn.primary{background:var(--accent);color:var(--onAccent)}
    .btn.secondary{background:transparent;border-color:var(--border);color:var(--text)}
    .btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
    .btn:disabled{opacity:.45}
    .textbtn{background:none;border:none;color:var(--accent);font-size:15px;font-weight:600;cursor:pointer;padding:10px}
    .textbtn.danger{color:var(--danger)}

    /* fields */
    input,select,textarea{
      width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-chip);
      color:var(--text);font-size:16px;padding:12px 12px;font-family:inherit
    }
    input:focus,select,textarea:focus{outline:none;border-color:var(--accent)}
    textarea{resize:vertical;min-height:64px}

    /* chips */
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:var(--r-chip);padding:9px 14px;font-size:14px;font-weight:500;cursor:pointer;min-height:40px}
    .chip.sel{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
    .dotpick{display:flex;gap:12px;margin-top:6px}
    .dotpick .d{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent}
    .dotpick .d.sel{border-color:var(--text)}

    /* status + misc */
    .pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--border)}
    .pill.warn{color:var(--warn);border-color:var(--warn)}
    .pill.ok{color:var(--ok);border-color:var(--ok)}
    .trend{font-weight:700}
    .up{color:var(--warn)} .down{color:var(--ok)} .same{color:var(--textMuted)}
    .disclaimer{color:var(--textMuted);font-size:13px;text-align:center;margin:18px 0 6px}

    /* empty state */
    .empty{text-align:center;padding:48px 16px;color:var(--textMuted)}
    .empty .ico{font-size:40px;margin-bottom:8px}

    /* bottom tabs */
    .tabs{position:fixed;left:0;right:0;bottom:0;max-width:var(--maxw);margin:0 auto;display:flex;background:var(--bg);border-top:1px solid var(--border)}
    .tabs a{flex:1;text-align:center;padding:10px 0 14px;color:var(--textMuted);text-decoration:none;font-size:11px;font-weight:600}
    .tabs a .ti{display:block;font-size:20px;margin-bottom:2px}
    .tabs a.on{color:var(--accent)}

    /* fab */
    .fab{position:fixed;right:max(16px,calc(50% - var(--maxw)/2 + 16px));bottom:84px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--onAccent);border:none;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center}

    /* banner ad slot (spec §2.5) */
    .adslot{height:50px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--textMuted);font-size:12px;letter-spacing:.1em;position:fixed;left:0;right:0;bottom:56px;max-width:var(--maxw);margin:0 auto;background:var(--bg)}

    .counter{text-align:center;color:var(--textMuted);font-size:14px;margin-top:4px}
    .list-sub{color:var(--textMuted);font-size:14px;margin-top:2px}
    hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0}
    a.inline{color:var(--accent)}

    /* add-document options */
    .option{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:var(--pad);margin:12px 0;cursor:pointer}
    .option:active{border-color:var(--accent)}
    .oico{font-size:28px;width:36px;text-align:center}
    .thumbs{display:flex;gap:8px;overflow-x:auto;margin:8px 0}
    .thumbs img{height:128px;border-radius:var(--r-chip);border:1px solid var(--border);background:var(--surface)}
    .thumbs.big img{height:auto;max-height:420px;max-width:100%}

    /* fields the reader was unsure about (amber = status, spec §2.1) */
    input.uncertain{border:1.5px solid var(--warn)}
    .uncertain-box{outline:1.5px solid var(--warn);outline-offset:4px;border-radius:var(--r-chip)}
    .warn-text{color:var(--warn)}
    .okbtn{padding:6px 0;font-size:14px}
    .link-row{cursor:pointer}
    details summary{cursor:pointer;font-weight:600}
    pre.ocr{white-space:pre-wrap;font-family:inherit;font-size:14px;margin:8px 0 0}

    /* symptom assistant */
    .bubble-user{margin-left:48px;border-color:var(--accent)}
    .bubble-bot{margin-right:32px}
    .bubble-summary{border-color:var(--accent)}
    .bubble-emergency{border:2px solid var(--danger)}
    .bubble-emergency .btn{text-decoration:none}
    .msg{line-height:1.55}

    /* in-page reminder */
    .toast{position:fixed;left:16px;right:16px;bottom:90px;max-width:488px;margin:0 auto;background:var(--bg);border:2px solid var(--accent);border-radius:var(--r-card);padding:var(--pad);z-index:20}
    .toast .btn{margin-top:10px;height:44px}
    .spin{display:inline-block;animation:spin 1.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .tabs a{font-size:10.5px}

    @media print{
      .topbar,.tabs,.fab,.adslot,.noprint{display:none!important}
      body{background:#fff;color:#000}
      .screen{padding:0}
    }
  </style>
</head>
<body>
  <div id="app"><div class="screen"><div class="empty"><div class="ico">◴</div>Loading…</div></div></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
